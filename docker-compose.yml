services:
  eqnn:
    build: .
    image: eqnn:latest
    env_file:
      - .env
    environment:
      WANDB_MODE: ${WANDB_MODE:-online}
      WANDB_PROJECT: ${WANDB_PROJECT:-eqnn}
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./multirun:/app/multirun
      - ./wandb:/app/wandb
      - ./results_def:/app/results_def
    # Pass Hydra overrides after `--`, e.g.:
    #   docker compose run --rm eqnn TRAINING.epochs=10 DATA.N=100
    command: []

  api:
    build: .
    image: eqnn:latest
    entrypoint: []
    command: ["python3", "-m", "uvicorn", "src.api:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      # Path to a final_model.pt inside the container; defaults to the most
      # recently modified checkpoint under outputs/ or multirun/ if unset.
      MODEL_PATH: ${MODEL_PATH:-}
    volumes:
      - ./outputs:/app/outputs
      - ./multirun:/app/multirun

  designer:
    build: .
    image: eqnn:latest
    entrypoint: []
    command:
      [
        "python3", "-m", "streamlit", "run", "src/designer_app.py",
        "--server.address=0.0.0.0", "--server.port=8501",
      ]
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      WANDB_MODE: ${WANDB_MODE:-online}
      WANDB_PROJECT: ${WANDB_PROJECT:-eqnn}
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./wandb:/app/wandb
      - ./results_def:/app/results_def
