hydra:
  job_logging:
    root:
      level: INFO
  sweep:
    subdir: ${hydra.job.override_dirname}

GENERAL:
  seed: 1234
  dev: "cpu"
  verbose: True
  num_workers: 0

DATA:
  N: 20  # number of images in the training set
  dataset: "mnist"
  augment_test: True
  # Apply a random p4m transform to every training image, re-randomized
  # every epoch (matches the reference d4_eqcnn training script's
  # random_d4_batch). Off by default: it disables train-set caching, so
  # every epoch re-runs the expensive embedding_unitary encoding instead
  # of reusing a cached copy — noticeably slower per epoch when on.
  augment_train: "none"  # one of: none, online, once — see src/data_loading.py
  img_size: 16
  data_dir: "data"

QNN:
  device: "default.qubit"
  num_qubits: 8
  reps: 2
  # config1: RY+CNOT (not equivariant)         | config2: RY+CNOT+twirling (equivariant)
  # config3: RX+RXY (not equivariant)           | config4: RX+RXY+twirling (equivariant)
  # config5: RX+frozen-RYY/RYYYY+twirling (equivariant)
  # config6: paper6, generator-equivariant      | config7: paper6, axis-scrambled (not equivariant)
  # config8: shared18, generator-equivariant    | config9: shared18, axis-scrambled (not equivariant)
  # config6-config9 need num_qubits=8 and ignore `reps` (fixed parameter budget)
  # — see src/qnn.py:ARCHITECTURES and src/paper_ansatzes.py
  architecture: "config1"
  # Only meaningful for config6-config9 (ignored for config1-config5):
  # null/"avg_x" measures the mean of X over every qubit (the default);
  # "x0_xhalf" measures only 0.5*(X_0 + X_{num_qubits//2}) — the paper's
  # own readout, i.e. only the first and (num_qubits//2+1)-th qubit.
  readout: null

TRAINING:
  epochs: 80
  learning_rate: 0.05
  patience: 5
  min_delta: 0.0001
