hydra:
  job_logging:
    root:
      level: INFO
  sweep:
    subdir: ${hydra.job.override_dirname}

GENERAL:
  seed: 1234
  dev: "cpu"
  verbose: True
  initialization_analysis: False
  num_workers: 0

DATA:
  N: 20  # number of images in the training set
  dataset: "mnist"
  augment_test: True
  img_size: 16
  data_dir: "data"

QNN:
  device: "default.qubit"
  num_qubits: 8
  p_err: 0.0
  reps: 2
  equivariance: True
  twirling: False
  remove_cross_edge: True

TRAINING:
  epochs: 80
  learning_rate: 0.05
  patience: 5
  min_delta: 0.0001
