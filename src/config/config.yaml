hydra:
  job_logging:
    root:
      level: INFO
  sweep:
    subdir: ${hydra.job.override_dirname}

GENERAL:
  seed: 1234
  dev: "cpu"
  verbose: True
  num_workers: 0

DATA:
  N: 20  # number of images in the training set
  dataset: "mnist"
  augment_test: True
  img_size: 16
  data_dir: "data"

QNN:
  device: "default.qubit"
  num_qubits: 8
  p_err: 0.0
  reps: 2
  # config1: RY+CNOT (not equivariant) | config2: RY+CNOT+twirling (equivariant)
  # config3: RX+CNOT (not equivariant) | config4: RX+CNOT+twirling (equivariant)
  # config5: RX+frozen-RYY/RYYYY+twirling (equivariant) — see src/qnn.py:ARCHITECTURES
  architecture: "config1"

TRAINING:
  epochs: 80
  learning_rate: 0.05
  patience: 5
  min_delta: 0.0001
