hydra:
  job_logging:
    root:
      level: INFO
  sweep:
    # A short, sequential per-sweep index rather than the concatenated
    # override string: that string only grows as more parameters get
    # swept (dataset, readout, augment_train, noise_p, noise_seed, ...)
    # and had already exceeded both eCryptfs's 143-byte filename limit
    # and the standard 255-byte ENAMETOOLONG limit on some sweeps. The
    # parameters a job actually used are still fully recoverable from
    # its summary.json / .hydra/overrides.yaml — nothing is lost, just
    # not visible in the directory name itself anymore.
    subdir: ${hydra.job.num}

GENERAL:
  seed: 1234
  dev: "cpu"
  verbose: True
  num_workers: 0

DATA:
  N: 20  # number of images in the training set
  dataset: "mnist"  # "mnist", "satellite", "planesnet", "ising" or "eurosat"
  class1: 3  # first MNIST digit class (remapped to label 0) — ignored for "satellite" (fixed ship=0/plane=1)
  class2: 4  # second MNIST digit class (remapped to label 1) — ignored for "satellite"
  augment_test: True
  # none: no augmentation. online: a random p4m transform re-randomized
  # every epoch (matches the reference d4_eqcnn training script's
  # random_d4_batch) — disables train-set caching, noticeably slower per
  # epoch. once: a random p4m transform drawn once per image, then cached
  # like the test set — fast, but weaker regularizer than online.
  augment_train: "none"  # one of: none, online, once — see src/data_loading.py
  # Derived from QNN.num_qubits (8 -> 16, 10 -> 32, 12 -> 64); leave null.
  img_size: null
  # Subtract each image's mean before L2 normalization (D4-invariant).
  center: False
  # satellite only: crop ship chips (80x80) to the planes' 20x20 footprint.
  crop_to_plane_scale: True
  # eurosat only: "highway_river" or "forest_industrial".
  eurosat_task: "highway_river"
  data_dir: "data"

QNN:
  device: "default.qubit"
  num_qubits: 8  # 8, 10 or 12 (16x16, 32x32 or 64x64 images)
  # Trainable classical affine post-processing sigmoid(2(w<O>+b)) of the
  # measured expectation value (2 extra parameters, invariance-preserving).
  output_bias: False
  # Stacked copies of the circuit, each with its own 6 trainable angles.
  layers: 1
  # config6: Equiv (generator-equivariant) | config7: NonEquiv (axis-scrambled)
  # config10: NonEquiv + explicit p4m twirling (exactly invariant, 8x cost)
  # — see src/qnn.py:ARCHITECTURES and src/paper_ansatzes.py
  architecture: "config6"
  # null/"avg_x" measures the mean of X over every qubit (the default);
  # "x0_xhalf" measures only 0.5*(X_0 + X_{num_qubits//2}) — the paper's
  # own readout, i.e. only the first and (num_qubits//2+1)-th qubit.
  readout: null
  # Monte Carlo single-qubit depolarizing noise, inserted after every gate
  # application (independently per wire touched, so a 2-qubit gate can hit
  # 0/1/2 of its qubits) — a random Pauli X/Y/Z with probability noise_p,
  # nothing otherwise. See src/noise.py's module docstring for why this
  # is a Monte Carlo realization rather than the analytic depolarizing
  # channel (this stays on default.qubit's fast statevector simulation;
  # the analytic channel needs default.mixed and would break batched
  # backprop training everywhere it's used).
  noise_p: 0.0  # 0.0 (default) disables noise entirely, at zero cost
  # Seeds which sites get hit and which Pauli they get — reproducible per
  # seed, like a fixed "noise realization". Must be a DIFFERENT value from
  # GENERAL.seed (which drives parameter initialization instead) — they
  # are two independent sources of randomness. Unused when noise_p is 0.
  noise_seed: 0

TRAINING:
  epochs: 80
  learning_rate: 0.05
  patience: 5
  min_delta: 0.0001
