hydra:
  job_logging:
    root:
      level: INFO
  sweep:
    subdir: ${hydra.job.override_dirname}

GENERAL:
  seed: 1234
  dev: "cpu"
  verbose: True
  num_workers: 0

DATA:
  N: 20  # number of images in the training set
  dataset: "mnist"
  augment_test: True
  img_size: 16
  data_dir: "data"

QNN:
  device: "default.qubit"
  num_qubits: 8
  reps: 2
  # config1: RY+CNOT (not equivariant)         | config2: RY+CNOT+twirling (equivariant)
  # config3: RX+RXY (not equivariant)           | config4: RX+RXY+twirling (equivariant)
  # config5: RX+frozen-RYY/RYYYY+twirling (equivariant)
  # config6: paper6, generator-equivariant      | config7: paper6, axis-scrambled (not equivariant)
  # config8: shared18, generator-equivariant    | config9: shared18, axis-scrambled (not equivariant)
  # config6-config9 need num_qubits=8 and ignore `reps` (fixed parameter budget)
  # — see src/qnn.py:ARCHITECTURES and src/paper_ansatzes.py
  architecture: "config1"

TRAINING:
  epochs: 80
  learning_rate: 0.05
  patience: 5
  min_delta: 0.0001
